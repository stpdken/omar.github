<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="An educational presentation about inclusive and accessible technology in the workplace.">
<title>InclusiveTech | Technology Without Barriers</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');

:root {
  --maroon: #68152b;
  --dark: #360b18;
  --wine: #8d2947;
  --light: #f5e2e7;
  --cream: #fffaf7;
  --white: #fff;
  --ink: #35151f;
  --muted: #69434e;
  --line: #ead2da;
  --shadow: 0 18px 45px rgba(59,11,25,.12);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  scroll-behavior: smooth;
}

body {
  font-family: "DM Sans", sans-serif;
  background: var(--cream);
  color: var(--ink);
  line-height: 1.7;
}

a { color: inherit; }
button { font: inherit; }

.hero {
  min-height: 760px;
  padding: 90px 6%;
  display: grid;
  grid-template-columns: 1.05fr .95fr;
  align-items: center;
  gap: 55px;
  background:
    radial-gradient(circle at 88% 24%, #efd3da 0 9%, transparent 9.5%),
    linear-gradient(135deg, #fffaf7, #f3dce2);
}

.tag {
  display: inline-block;
  background: var(--light);
  color: var(--maroon);
  padding: 8px 14px;
  border-radius: 30px;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 1px;
  margin-bottom: 18px;
}

.hero h1,
.section-title,
.work-copy h2,
.closing h2 {
  font-family: "Playfair Display", serif;
  color: var(--dark);
  line-height: 1.08;
}

.hero h1 {
  font-size: clamp(42px, 5.3vw, 70px);
  margin-bottom: 22px;
  max-width: 680px;
}

.hero h1 span { color: var(--wine); }

.hero-copy {
  max-width: 650px;
  color: var(--muted);
  font-size: 17px;
  margin-bottom: 22px;
}

.hero-actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin: 28px 0;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--maroon);
  color: #fff;
  text-decoration: none;
  border: 2px solid var(--maroon);
  padding: 13px 19px;
  border-radius: 13px;
  font-weight: 800;
  cursor: pointer;
  transition: .2s;
}

.btn:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow);
}

.btn.secondary {
  background: transparent;
  color: var(--maroon);
}

.hero-note {
  font-size: 13px;
  color: #765461;
}

/* COMPUTER ILLUSTRATION */

.computer-wrap {
  max-width: 570px;
  width: 100%;
  margin: auto;
  filter: drop-shadow(0 25px 25px rgba(59,11,25,.14));
}

.monitor {
  background: #40101e;
  border: 10px solid #40101e;
  border-radius: 23px;
  padding: 9px;
  position: relative;
}

.screen {
  min-height: 330px;
  border-radius: 13px;
  padding: 18px;
  background: linear-gradient(135deg, #fff8fa, #e9c6d0);
  overflow: hidden;
}

.screen-top {
  display: flex;
  gap: 6px;
  margin-bottom: 20px;
}

.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #a94c68;
}

.desktop-layout {
  display: grid;
  grid-template-columns: 1fr .8fr;
  gap: 15px;
  align-items: center;
}

.desktop-layout h2 {
  font-size: clamp(22px, 3vw, 33px);
  line-height: 1.1;
  color: var(--maroon);
  font-family: "Playfair Display", serif;
}

.desktop-layout p {
  font-size: 13px;
  color: #69424e;
  margin-top: 12px;
}

.desktop-art {
  border: 2px solid rgba(104,21,43,.16);
  background: rgba(255,255,255,.55);
  border-radius: 16px;
  min-height: 170px;
  display: grid;
  place-items: center;
  font-size: 70px;
  position: relative;
}

.mini-window {
  position: absolute;
  bottom: 12px;
  left: 12px;
  right: 12px;
  background: white;
  border-radius: 8px;
  padding: 7px;
  display: flex;
  gap: 5px;
}

.mini-window i {
  display: block;
  height: 6px;
  border-radius: 5px;
  background: #dbaab9;
  flex: 1;
}

.stand {
  height: 40px;
  width: 100px;
  background: #40101e;
  margin: auto;
}

.base {
  height: 13px;
  width: 205px;
  max-width: 60%;
  background: #40101e;
  border-radius: 20px;
  margin: auto;
}

/* GENERAL SECTIONS */

.section { padding: 95px 6%; }
.section.white { background: #fff; }
.section.pink { background: #f4e0e5; }

.section-head {
  text-align: center;
  max-width: 820px;
  margin: 0 auto 42px;
}

.section-title {
  font-size: clamp(34px, 4vw, 48px);
  margin-bottom: 15px;
}

.section-head p { color: var(--muted); }

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin: 35px 0 0;
}

.stat {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 20px;
  text-align: center;
}

.stat strong {
  display: block;
  color: var(--maroon);
  font-size: 17px;
}

.stat span {
  font-size: 13px;
  color: var(--muted);
}

/* TOPIC NAVIGATION */

.topic-menu {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 13px;
}

.topic-btn {
  border: 2px solid var(--line);
  background: #fff8fa;
  border-radius: 18px;
  padding: 19px 12px;
  cursor: pointer;
  color: var(--dark);
  min-height: 140px;
  transition: .2s;
}

.topic-btn .icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 48px;
  height: 48px;
  margin: 0 auto 10px;
  border-radius: 14px;
  background: #f4dfe5;
  color: #6f1730;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .3px;
}

.topic-btn strong {
  font-size: 13px;
  line-height: 1.35;
  display: block;
}

.topic-btn:hover,
.topic-btn.active {
  transform: translateY(-4px);
  border-color: var(--wine);
  box-shadow: var(--shadow);
}

.topic-btn.active {
  background: var(--maroon);
  color: #fff;
}

/* PRESENTATION SLIDES */

.slide-container {
  margin-top: 28px;
  background: var(--dark);
  border-radius: 26px;
  padding: clamp(22px, 4vw, 45px);
  color: #fff;
  box-shadow: 0 25px 60px rgba(59,11,25,.22);
  position: relative;
  overflow: hidden;
}

.slide-container:after {
  content: "";
  position: absolute;
  width: 280px;
  height: 280px;
  border: 40px solid rgba(255,255,255,.04);
  border-radius: 50%;
  right: -100px;
  top: -110px;
  pointer-events: none;
}

.slide {
  display: none;
  position: relative;
  z-index: 1;
  animation: slideIn .3s ease;
}

.slide.active { display: block; }

@keyframes slideIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.slide-number {
  color: #e3a9b8;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 2px;
  margin-bottom: 12px;
}

.slide h2 {
  font-family: "Playfair Display", serif;
  font-size: clamp(29px, 4vw, 43px);
  line-height: 1.15;
  margin-bottom: 14px;
  max-width: 800px;
}

.slide-intro {
  color: #e5c9d0;
  max-width: 850px;
  margin-bottom: 20px;
}

.slide-visual {
  display: flex;
  align-items: center;
  gap: 14px;
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.12);
  padding: 14px 17px;
  border-radius: 15px;
  margin: 18px 0 22px;
}

.slide-visual .device { font-size: 37px; }
.slide-visual p { font-size: 13px; color: #e5c9d0; }

.slide-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}

.slide-card {
  background: rgba(255,255,255,.09);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 16px;
  padding: 20px;
}

.slide-card .emoji {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 54px;
  min-height: 54px;
  border-radius: 16px;
  background: #f4dfe5;
  color: #6f1730;
  margin-bottom: 8px;
}

.slide-card h3 {
  font-size: 16px;
  line-height: 1.35;
  margin-bottom: 8px;
}

.slide-card p {
  font-size: 13px;
  color: #dec2ca;
  line-height: 1.7;
}

.example-box {
  margin-top: 17px;
  border-left: 4px solid #e8b7c4;
  background: rgba(255,255,255,.07);
  padding: 15px 17px;
  border-radius: 0 12px 12px 0;
  color: #f5e4e9;
  font-size: 14px;
}

.example-box strong { color: #fff; }

.slide-controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 28px;
  position: relative;
  z-index: 2;
}

.arrow {
  border: 1px solid rgba(255,255,255,.28);
  background: rgba(255,255,255,.08);
  color: white;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 20px;
}

.arrow:hover {
  background: #fff;
  color: var(--maroon);
}

.dots {
  display: flex;
  gap: 7px;
  align-items: center;
}

.slide-dot {
  border: 0;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #80515f;
  cursor: pointer;
}

.slide-dot.active {
  width: 25px;
  border-radius: 20px;
  background: #e8b7c4;
}
